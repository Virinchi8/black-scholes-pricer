[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsm"
version = "0.1.0"
description = "Black-Scholes-Merton pricer, analytic Greeks and implied-volatility solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "mpmath>=1.3"]

[tool.setuptools]
packages = ["bsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
